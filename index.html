<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#1D9E75"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="DermSec"/>
  <title>Derm Secretary</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="app-name">Derm Secretary</div>
    <div class="day-badge" id="datebadge">–</div>
  </div>
  <div class="greeting" id="greeting">Loading...</div>
</div>

<div class="prog-wrap">
  <div class="prog-row">
    <span id="progtxt">0 of 0 steps</span>
    <span id="progpct">0%</span>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="progfill" style="width:0%"></div></div>
</div>

<div class="container">

  <div class="notif-bar" id="notifbar" style="display:none"></div>

  <div class="notif-settings">
    <div class="ns-title">5-min reminders until done</div>
    <div class="ns-row">
      <span>Repeat notifications</span>
      <div class="toggle on" id="toggle" onclick="toggleNotif()">
        <div class="toggle-knob"></div>
      </div>
    </div>
  </div>

  <div class="day-chips" id="daychips"></div>

  <div id="tasklist"></div>

  <div class="wudhu-card">
    <div class="wudhu-title">After-wudhu moisturise (water only — tick each one)</div>
    <div id="wudhutasks"></div>
    <div class="wcount" id="wcount">0 of 5 wudhu moisturised</div>
  </div>

  <div class="done-card" id="donecard">
    <p>All done for this session</p>
    <small>Skin is being taken care of. See you next round.</small>
  </div>

  <span class="reset-link" onclick="resetDay()">Reset today's progress</span>

</div>

<script src="app.js"></script>
</body>
</html>
